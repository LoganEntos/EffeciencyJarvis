<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="hub-token" content="__HUB_TOKEN__">
<title>Claude Code Hub</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <h1><span class="logo"></span>Claude Code Hub</h1>
  <span class="badge" id="statusBadge"><span class="dot ok"></span>server live</span>
  <span class="badge" id="nodeBadge"></span>
  <span class="badge mono" id="projBadge" title="project directory">loading…</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="refreshTab" title="Refresh current tab (R)">⟳</button>
</header>
<div class="wrap">
  <nav>
    <div class="navlabel">Work</div>
    <a data-tab="run" class="active"><span class="ico">▷</span><span class="txt">Run</span><kbd>1</kbd></a>
    <a data-tab="tasks"><span class="ico">☰</span><span class="txt">Tasks</span><kbd>2</kbd></a>
    <a data-tab="files"><span class="ico">⇪</span><span class="txt">Files</span><kbd>3</kbd></a>
    <a data-tab="sessions"><span class="ico">≣</span><span class="txt">Sessions</span><kbd>4</kbd></a>
    <div class="navlabel" style="margin-top:14px">Monitor</div>
    <a data-tab="overview"><span class="ico">◈</span><span class="txt">Overview</span><kbd>5</kbd></a>
    <a data-tab="swarm"><span class="ico">⬡</span><span class="txt">Swarm</span><kbd>6</kbd></a>
    <a data-tab="graph"><span class="ico">⌬</span><span class="txt">Graph</span><kbd>7</kbd></a>
    <div class="navlabel" style="margin-top:14px">Library</div>
    <a data-tab="agents"><span class="ico">⛬</span><span class="txt">Agents</span><kbd>8</kbd></a>
    <a data-tab="skills"><span class="ico">✦</span><span class="txt">Skills</span><kbd>9</kbd></a>
    <a data-tab="commands"><span class="ico">❯_</span><span class="txt">Commands</span><kbd>0</kbd></a>
    <a data-tab="config"><span class="ico">⚙</span><span class="txt">Config</span></a>
  </nav>
  <main>
    <section id="run"></section>
    <section id="tasks" class="hidden"></section>
    <section id="files" class="hidden"></section>
    <section id="sessions" class="hidden"></section>
    <section id="overview" class="hidden"></section>
    <section id="swarm" class="hidden"></section>
    <section id="graph" class="hidden"></section>
    <section id="agents" class="hidden"></section>
    <section id="skills" class="hidden"></section>
    <section id="commands" class="hidden"></section>
    <section id="config" class="hidden"></section>
  </main>
</div>
<script src="assets/app.js"></script>
<script src="assets/graph.js"></script>
<script src="assets/run.js"></script>
<script src="assets/tasks.js"></script>
<script src="assets/files.js"></script>
<script>boot();</script>
</body>
</html>
