<header>
  <button id="navToggle" title="Toggle navigation menu" aria-label="Toggle navigation menu"><svg class="btnico" aria-hidden="true"><use href="#nv-menu"/></svg></button>
  <h1><span class="logo"></span>Claude Code Hub</h1>
  <span class="badge" id="statusBadge" aria-live="polite"><span class="dot ok"></span>server live</span>
  <span class="badge" id="liveBadge" title="Watch Claude Code run live" aria-live="polite"><span class="dot"></span>idle</span>
  <span class="badge mono" id="spendBadge" title="spend today — stays visible on mobile so autopilot spend is never out of sight">$0.00 today</span>
  <span class="badge" id="nodeBadge"></span>
  <span class="badge mono" id="projBadge" title="project directory">loading…</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="themeTab" title="Toggle dark / light theme" aria-label="Toggle dark / light theme"><svg class="btnico" aria-hidden="true"><use href="#nv-contrast"/></svg></button>
  <button class="iconbtn" id="restartTab" title="Restart the hub server" aria-label="Restart the hub server"><svg class="btnico" aria-hidden="true"><use href="#nv-power"/></svg></button>
  <button class="iconbtn" id="refreshTab" title="Refresh current tab (R)" aria-label="Refresh current tab"><svg class="btnico" aria-hidden="true"><use href="#nv-rotate-cw"/></svg></button>
</header>
