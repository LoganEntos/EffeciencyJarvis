<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="hub-token" content="__HUB_TOKEN__">
<title>Claude Code Hub</title>
<!-- Phone install (PWA): standalone home-screen app over the user's Tailscale
     HTTPS URL. No service worker (it must never cache the per-boot token page). -->
<meta name="theme-color" content="#0e0d0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Hub">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/vendor/icons/hub-icon.svg">
<link rel="icon" type="image/svg+xml" href="/vendor/icons/hub-icon.svg">
<link rel="stylesheet" href="/vendor/css/fonts.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <button id="navToggle" title="Toggle navigation menu" aria-label="Toggle navigation menu">☰</button>
  <h1><span class="logo"></span>Claude Code Hub</h1>
  <span class="badge" id="statusBadge"><span class="dot ok"></span>server live</span>
  <span class="badge" id="liveBadge" title="Watch Claude Code run live"><span class="dot"></span>idle</span>
  <span class="badge mono" id="spendBadge" title="spend today — stays visible on mobile so autopilot spend is never out of sight">$0.00 today</span>
  <span class="badge" id="nodeBadge"></span>
  <span class="badge mono" id="projBadge" title="project directory">loading…</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="themeTab" title="Toggle dark / light theme" aria-label="Toggle dark / light theme">◐</button>
  <button class="iconbtn" id="restartTab" title="Restart the hub server" aria-label="Restart the hub server">⏻</button>
  <button class="iconbtn" id="refreshTab" title="Refresh current tab (R)" aria-label="Refresh current tab">⟳</button>
</header>
<div class="wrap">
  <nav id="mainNav">
    <div class="navlabel">Work</div>
    <a data-tab="run" class="active"><span class="ico">▷</span><span class="txt">Run</span><kbd>1</kbd></a>
    <a data-tab="live"><span class="ico">◉</span><span class="txt">Live</span><kbd>2</kbd></a>
    <a data-tab="tasks"><span class="ico">☰</span><span class="txt">Tasks</span><kbd>3</kbd></a>
    <a data-tab="files"><span class="ico">⇪</span><span class="txt">Files</span><kbd>4</kbd></a>
    <a data-tab="sessions"><span class="ico">≣</span><span class="txt">Sessions</span><kbd>5</kbd></a>
    <div class="navlabel" style="margin-top:14px">Monitor</div>
    <a data-tab="memory"><span class="ico">◇</span><span class="txt">Memory</span><kbd>6</kbd></a>
    <a data-tab="overview"><span class="ico">◈</span><span class="txt">Overview</span><kbd>7</kbd></a>
    <a data-tab="graph"><span class="ico">⬡</span><span class="txt">Graph</span><kbd>8</kbd></a>
    <div class="navlabel" style="margin-top:14px">Library</div>
    <a data-tab="agents"><span class="ico">⛬</span><span class="txt">Agents</span><kbd>9</kbd></a>
    <a data-tab="skills"><span class="ico">✦</span><span class="txt">Skills</span><kbd>0</kbd></a>
    <a data-tab="commands"><span class="ico">❯_</span><span class="txt">Commands</span></a>
    <a data-tab="assets"><span class="ico">◧</span><span class="txt">Assets</span></a>
    <a data-tab="tools"><span class="ico">⚒</span><span class="txt">Tools</span></a>
    <a data-tab="config"><span class="ico">⚙</span><span class="txt">Config</span></a>
  </nav>
  <div class="navOverlay" id="navOverlay"></div>
  <main>
    <section id="run"></section>
    <section id="live" class="hidden"></section>
    <section id="tasks" class="hidden"></section>
    <section id="files" class="hidden"></section>
    <section id="sessions" class="hidden"></section>
    <section id="memory" class="hidden"></section>
    <section id="overview" class="hidden"></section>
    <section id="graph" class="hidden"></section>
    <section id="agents" class="hidden"></section>
    <section id="skills" class="hidden"></section>
    <section id="commands" class="hidden"></section>
    <section id="assets" class="hidden"></section>
    <section id="tools" class="hidden"></section>
    <section id="config" class="hidden"></section>
  </main>
</div>
<script src="assets/app.js"></script>
<script src="assets/overview.js"></script>
<script src="assets/config.js"></script>
<script src="assets/agentviz.js"></script>
<script src="assets/graph.js"></script>
<script src="assets/run.js"></script>
<script src="assets/runhistory.js"></script>
<script src="assets/live.js"></script>
<script src="assets/tasks.js"></script>
<script src="assets/memory.js"></script>
<script src="assets/files.js"></script>
<script src="assets/assetlib.js"></script>
<script src="assets/voice.js"></script>
<script src="assets/voicecfg.js"></script>
<script src="assets/admin.js"></script>
<script src="assets/teams.js"></script>
<script>boot(); if (window.HubVoice) HubVoice.init();</script>
</body>
</html>
